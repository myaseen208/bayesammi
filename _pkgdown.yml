url: https://myaseen208.com/bayesammi/
title: Bayesian Estimation of the Additive Main Effects and Multiplicative Interaction Model

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: mathjax
  bslib:
    base_font:
      google: Crimson Pro
    heading_font:
      google: Crimson Pro
    code_font:
      google: JetBrains Mono
    bg: "#ffffff"
    fg: "#1a1a1a"
    primary: "#2c5f8a"
    link-color: "#2c5f8a"

home:
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  structure:
    left:  [home, reference, articles, pdf, news]
    right: [search, github]
  components:
    pdf:
      text: PDF
      href: pdf/index.html

