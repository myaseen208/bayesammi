  - title: Getting started
    navbar: Getting started
    contents:
      - bayesammi_01_getting_started
      - bayesammi_02_theory
  - title: The published analysis
    navbar: Published analysis
    contents:
      - bayesammi_03_crossa2011
  - title: Methods
    navbar: Methods
    contents:
      - bayesammi_04_biplots
      - bayesammi_05_convergence
      - bayesammi_06_priors_terms
  - title: Beyond the article
    navbar: Extensions
    contents:
      - bayesammi_07_unbalanced_het
      - bayesammi_08_gge
      - bayesammi_09_decisions
  - title: Bayesian stability analysis
    navbar: Stability
    contents:
      - bayesammi_10_stability_models
      - bayesammi_11_stability_indices
  - title: The application
    navbar: Application
    contents:
      - bayesammi_12_app
  - title: Validation, interpretation and references
    navbar: Validation and references
    contents:
      - bayesammi_13_validation
      - bayesammi_14_interpretation
