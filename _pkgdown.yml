reference:
  - title: Bayesian AMMI
    desc: Priors, the Gibbs sampler of Crossa et al. (2011) and the biplot with HPD regions.
    contents:
      - bam_priors
      - bayes_ammi
      - biplots
  - title: Decisions for breeders
    desc: Predictions, winners, probabilities of superior performance and stability, ranks and stability measures.
    contents:
      - bam_predict
      - bam_winners
      - bam_superiority
      - bam_ranks
      - bam_stability
  - title: Bayesian stability analysis
    desc: Finlay-Wilkinson, Eberhart-Russell and Shukla models; posterior distributions of stability indices.
    contents:
      - bayes_stability
      - bam_stab_priors
      - bam_indices
      - bam_ammi_indices
  - title: Model choice
    desc: DIC and WAIC, posterior predictive checks and draws for posterior, bayesplot and coda.
    contents:
      - bam_compare
      - bam_ppc
      - "bam-draws"
  - title: Application
    contents:
      - bam_app
  - title: Interpretation and references
    contents:
      - bam_interpret
      - bam_cite
  - title: Tables and least-squares AMMI
    desc: Cell means and variances, main and interaction effects, least-squares AMMI and the mixed model.
    contents:
      - ge_mean
      - ge_var
      - g_eff
      - e_eff
      - ge_eff
      - ge_ammi
      - ge_model
  - title: Matrices
    contents:
      - matrix_k
      - orthnorm
  - title: Data
    contents:
      - Maiz
  - title: Results and utilities
    contents:
      - "bam-methods"
      - bam_theme
      - bam_save
      - bam_notation
      - bam_reference
      - "bayesammi-package"

